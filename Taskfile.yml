# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  configure:
    cmds:
      - >
        cmake
        {{if eq (.FRESH | default "false") "true"}}--fresh{{end}}
        -B build
        -G "Ninja Multi-Config"
        .
    env:
      C: clang
      CXX: clang++
      CMAKE_POLICY_VERSION_MINIMUM: 3.5 # 兼容 antlr4
      CMAKE_EXPORT_COMPILE_COMMANDS: ON # clangd 支持

  build:
    cmds:
      - cmake --build build

  build:release:
    cmds:
      - cmake --build build --config Release
      - strip build/Release/mioyi-lang
